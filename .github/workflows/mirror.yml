name: Mirror Chrome for Testing Stable

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact current or historical Stable four-part version
        required: false
        type: string
      backfill_historical_stable:
        description: Publish the five retained historical Stable major versions and current Stable
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-for-testing-stable-publisher
  cancel-in-progress: false

env:
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://aliyun-oss.yaklang.com' }}
  MANIFEST_MAX_VERSIONS: ${{ vars.MANIFEST_MAX_VERSIONS || '10' }}
  OSS_ENDPOINT: https://oss-accelerate.aliyuncs.com
  OSS_BUCKET: yaklang

jobs:
  publish:
    name: Publish complete Stable release set
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Resolve official release set
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BACKFILL_HISTORICAL_STABLE: ${{ inputs.backfill_historical_stable }}
        run: |
          if [[ "$BACKFILL_HISTORICAL_STABLE" == "true" && -n "$REQUESTED_VERSION" ]]; then
            echo "version and backfill_historical_stable cannot be used together" >&2
            exit 1
          fi
          if [[ "$BACKFILL_HISTORICAL_STABLE" == "true" ]]; then
            {
              echo current
              python - <<'PY'
          import json
          for item in json.load(open("config/historical-stable-versions.json"))["versions"]:
              print(item["version"])
          PY
            } > /tmp/release-targets.txt
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            printf '%s\n' "$REQUESTED_VERSION" > /tmp/release-targets.txt
          else
            echo current > /tmp/release-targets.txt
          fi

          index=0
          while IFS= read -r target; do
            release_dir="dist/releases/$(printf '%02d' "$index")"
            mkdir -p "$release_dir"
            args=()
            if [[ "$target" != "current" ]]; then
              args+=(--version "$target")
            fi
            python scripts/resolve-release.py \
              "${args[@]}" \
              --public-base-url "$PUBLIC_BASE_URL" \
              --output "$release_dir/release.json"
            index=$((index + 1))
          done < /tmp/release-targets.txt

      - name: Download and validate every portable ZIP in the release set
        run: |
          for release_file in dist/releases/*/release.json; do
            release_dir="$(dirname "$release_file")"
            python scripts/download-and-verify.py \
              --release "$release_file" \
              --output-dir "$release_dir/files" \
              --entry-output "$release_dir/release-entry.json"
          done

      - name: Upload immutable release objects through OSS acceleration
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
        run: |
          for entry in dist/releases/*/release-entry.json; do
            release_dir="$(dirname "$entry")"
            python scripts/upload-oss.py \
              --endpoint "$OSS_ENDPOINT" \
              --bucket "$OSS_BUCKET" \
              release \
              --release-entry "$entry" \
              --release-dir "$release_dir/files"
          done

      - name: Verify newly published public object headers for every release
        run: |
          for entry in dist/releases/*/release-entry.json; do
            python scripts/verify-public.py \
              --public-base-url "$PUBLIC_BASE_URL" \
              --release-entry "$entry"
          done

      - name: Fetch existing manifest if present
        run: |
          manifest_url="$PUBLIC_BASE_URL/browsers/chrome/manifest.json?mirror_build=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          status="$(curl --silent --show-error --location --retry 4 --retry-all-errors \
            --output dist/existing-manifest.json --write-out '%{http_code}' "$manifest_url")"
          case "$status" in
            200) ;;
            404) rm -f dist/existing-manifest.json ;;
            *) echo "cannot read existing manifest: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Build and validate bounded manifest with retained history
        run: |
          if [[ -f dist/existing-manifest.json ]]; then
            cp dist/existing-manifest.json dist/manifest.json
          fi
          for entry in dist/releases/*/release-entry.json; do
            existing_args=()
            if [[ -f dist/manifest.json ]]; then
              existing_args+=(--existing-manifest dist/manifest.json)
            fi
            python scripts/build-manifest.py \
              --release-entry "$entry" \
              "${existing_args[@]}" \
              --max-versions "$MANIFEST_MAX_VERSIONS" \
              --pinned-versions-file config/historical-stable-versions.json \
              --output dist/manifest.next.json \
              --checksum-output dist/manifest.next.json.sha256.txt
            mv dist/manifest.next.json dist/manifest.json
            mv dist/manifest.next.json.sha256.txt dist/manifest.json.sha256.txt
          done
          python scripts/validate-manifest.py dist/manifest.json

      - name: Publish manifest then its checksum
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
        run: |
          python scripts/upload-oss.py \
            --endpoint "$OSS_ENDPOINT" \
            --bucket "$OSS_BUCKET" \
            manifest \
            --manifest dist/manifest.json \
            --manifest-checksum dist/manifest.json.sha256.txt

      - name: Publish summary
        run: |
          {
            echo "## Chrome for Testing mirror"
            echo
            echo "Published and OSS-verified versions:"
            for entry in dist/releases/*/release-entry.json; do
              version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$entry")"
              echo "- \`$version\`"
            done
            echo
            echo "Manifest: $PUBLIC_BASE_URL/browsers/chrome/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-production:
    name: Verify published content from the public CDN
    needs: publish
    uses: ./.github/workflows/verify.yml
    with:
      public_base_url: ${{ vars.PUBLIC_BASE_URL || 'https://aliyun-oss.yaklang.com' }}
